<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Paper Book</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd866"/><stop offset="1" stop-color="#ffb52e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".95"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e6c8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e6c8"/>
    </linearGradient>
  </defs>
  <!-- warm squircle -->
  <rect width="512" height="512" rx="124" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="116" fill="none" stroke="#fff3c2" stroke-opacity=".55" stroke-width="4"/>
  <!-- lamplight glow -->
  <circle cx="256" cy="300" r="210" fill="url(#glow)"/>
  <!-- night sky: crescent moon and two stars -->
  <path d="M372 92a58 58 0 1 0 44 96a46 46 0 1 1 -44 -96z" fill="#2f2f2f"/>
  <path d="M168 120l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#2f2f2f"/>
  <path d="M232 168l4.5 11 11 4.5-11 4.5-4.5 11-4.5-11-11-4.5 11-4.5z" fill="#2f2f2f"/>
  <!-- book: teal cover under cream pages -->
  <path d="M256 330 C 196 300, 124 300, 74 318 L 74 418 C 124 402, 196 404, 256 438 C 316 404, 388 402, 438 418 L 438 318 C 388 300, 316 300, 256 330 Z"
        fill="#19acd6" stroke="#2f2f2f" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 304 C 206 272, 146 270, 100 288 L 100 392 C 146 376, 206 378, 256 410 Z" fill="url(#pageL)" stroke="#2f2f2f" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 304 C 306 272, 366 270, 412 288 L 412 392 C 366 376, 306 378, 256 410 Z" fill="url(#pageR)" stroke="#2f2f2f" stroke-width="14" stroke-linejoin="round"/>
  <!-- a few lines of story -->
  <g stroke="#2f2f2f" stroke-opacity=".28" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M130 318 C 160 308, 196 308, 224 318"/><path d="M130 346 C 160 336, 196 336, 224 346"/>
    <path d="M288 318 C 316 308, 352 308, 382 318"/><path d="M288 346 C 316 336, 344 336, 360 340"/>
  </g>
  <!-- red ribbon bookmark hanging from the spine -->
  <path d="M244 404 L 268 404 L 268 470 L 256 458 L 244 470 Z" fill="#e0453a" stroke="#2f2f2f" stroke-width="10" stroke-linejoin="round"/>
  <!-- a little heart rising from the story -->
  <path d="M256 258 c -8 -14 -32 -10 -30 8 c 2 14 22 24 30 30 c 8 -6 28 -16 30 -30 c 2 -18 -22 -22 -30 -8 z" fill="#e0453a" stroke="#2f2f2f" stroke-width="10" stroke-linejoin="round"/>
</svg>
